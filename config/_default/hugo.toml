title = "Centre for Environmental Data Analysis"
copyright = "Copyright © 2025 Science and Technology Facilities Council."
enableGitInfo = false

# additional settings
#baseURL = "https://www.ceda.ac.uk"
canonifyURLs = true # for subdirectory deployment
enableEmoji = true
enableRobotsTXT = true
enableInlineShortcodes = true
summaryLength = 20
#Parser.wrapStandAloneImageWithinParagraph = false # see https://gethinode.com/docs/content/images-and-figures/

# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson", "warn-missing-page-argument"] # , "warn-invalid-arguments"
#ignoreLogs = ['warn-missing-page-argument']

timeout = "600s"

locale = "en-gb"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[outputFormats]
  [outputFormats.server]
    mediaType = "application/toml"
    baseName = "server"
    isPlainText = true
    notAlternative = true
    permalinkable = true
    root = true
  [outputFormats.XML]
    isPlainText = false
    mediaType = "application/xml"
    isHtml = false
    noUgly = true
    permalinkable = false
    name = "xml"

[outputs]
home = ["HTML", "RSS", "server"]

[build]
  writeStats = true
  
[taxonomies]
  tag = 'tags'

[pagination]
  pagerSize = 9

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

  [privacy.googleAnalytics]
    disable = false
    respectDoNotTrack = false

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.x]
    disableInlineCSS = true
  [services.googleAnalytics]
    # ID = "G-xxxxxxxxxx"

[minify] # see https://discourse.gohugo.io/t/minify-config-tutorials/28179/5
  disableHTML = false
  disableJS = true
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = true
    [minify.tdewolff.js]
      keepVarNames = true
      precision = 0
      keepWhitespace = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.imports]]
    path = "github.com/gethinode/mod-blocks/v2"
  [[module.imports]]
    path = "github.com/gethinode/hinode/v3"

[segments]
  [segments.headers]
    [[segments.headers.includes]]
       kind = '{home}'
       output = '{server}'
