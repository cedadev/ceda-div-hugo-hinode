name: Lint build deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CACHE_KEY: 'hugo-hinode-template'

permissions:
  pull-requests: read
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # [24/AUG/23] Adjusted from npm ci to prevent EBADPLATFORM error due to fsevents
    - name: Install npm
      run: npm i

    - name: Lint the source files
      run: npm run lint

  build:
    #needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: "stable"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Dart Sass
      env:
        DART_SASS_VERSION: "1.98.0"
      run: |
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
          | tar -xz -C "$HOME"
        echo "$HOME/dart-sass" >> "$GITHUB_PATH"
      shell: bash

    - name: Install npm dependencies
      run: npm i

    # Cache Hugo cachedir and resourcedir (configured in config/ci/hugo.toml).
    # The key restores the previous snapshot as a warm start, then saves a fresh one after build.
    # No additional content-based invalidation is needed; Hugo uses checksums itself.
    #
    # The suffix rotates weekly rather than per run. A run_id suffix saves a fresh entry every run and
    # never reclaims the previous one, and a repository's Actions cache is a single ~10 GB LRU pool
    # shared by every workflow in it — so those entries fill the pool and GitHub then evicts by last
    # access, taking out the small caches other jobs depend on rather than the ones causing the pressure.
    #
    # %G/%V are the ISO year and week and must be paired — %Y/%V is wrong across a year boundary.
    - name: Compute the weekly cache epoch
      id: cache-epoch
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Use Hugo cache
      uses: actions/cache@v6
      with:
        path: ${{ env.HUGO_CACHEDIR }}
        key: ${{ runner.os }}-${{ env.CACHE_KEY }}-${{ steps.cache-epoch.outputs.week }}
        restore-keys: |
          ${{ runner.os }}-${{ env.CACHE_KEY }}-

    - name: Display environment
      run: npm run env

    - name: Configure GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: pages
      uses: actions/configure-pages@v6

    - name: Build site
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      run: npm run build:cache

    - name: Prepare site for GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm run prebuild

    - name: Build site for GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm run build -- -e ci --baseURL "${{ steps.pages.outputs.base_url }}/"

    - name: Upload Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./public

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4